name: Simply
description: 'Simply (hellosimply.com) is a consumer creative-learning company that
  makes AI-powered mobile apps for teaching music and art to beginners, with the stated
  mission of making the pursuit of creative hobbies simple and fun for all. Its product
  suite spans Simply Piano, Simply Guitar, Simply Sing, and the free Simply Tune tuner
  for music, plus Simply Draw for art, and a set of emerging extended-reality experiences
  including Simply Piano XR, Simply Piano for Apple Vision Pro and Google Android XR,
  and Simply Draw for Meta AI Glasses. Backed by GV, Simply is a direct-to-consumer
  subscription business and does not publish a public developer API, SDK, or developer
  portal; press inquiries are handled at press@hellosimply.com.'
